name: ci

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:

jobs:
  test-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        perl-version:
          - '5.24'
          - 'latest'
    steps:
      - uses: actions/checkout@v7
      - uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl-version }}
      - name: Install Dependencies
        run: curl -fsSL https://github.com/skaji/cpm/releases/latest/download/cpm | perl - install -g --top-level-phase runtime,test,develop --top-level-relationship requires,recommends --show-build-log-on-failure
      - run: prove -lr t

  release:
    needs:
      - test-linux
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      id-token: write # actions/attest
      attestations: write # actions/attest
      artifact-metadata: write # actions/attest
      contents: write # gh release
    steps:
      - uses: actions/checkout@v7
      - name: Prepare variables
        id: var
        run: echo dist=$(jq -r .name META.json)-${{ github.ref_name }} >> $GITHUB_OUTPUT
      - name: Generate archive
        run: |
          git -c tar.umask=0002 archive \
            --format=tar.gz \
            -9 \
            --prefix=${{ steps.var.outputs.dist }}/ \
            --output=${{ steps.var.outputs.dist }}.tar.gz \
            ${{ github.ref_name }}
      - uses: actions/attest@v4
        id: attest
        with:
          subject-path: ${{ steps.var.outputs.dist }}.tar.gz
      - name: Create release
        run: |
          gh release create --repo ${{ github.repository }} ${{ github.ref_name }} \
            --notes "Artifact attestation: ${{ steps.attest.outputs.attestation-url }}" \
            ${{ steps.var.outputs.dist }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: skaji/action-pause-upload@v1
        with:
          files: ${{ steps.var.outputs.dist }}.tar.gz
          pause-token: ${{ secrets.PAUSE_TOKEN }}
